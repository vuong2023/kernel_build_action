name: CI
on:
  push:
    branches: main
    paths:
      - '.github/workflows/main.yml'
      - 'action.yml'

  pull_request:
  workflow_dispatch:

jobs:
  ci-test:
    name: Build Kernel
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

    - name: Build Kernel
      uses: ./
      with:
          kernel-url: https://github.com/VDavid003/universal7885_treeui_kernel
          kernel-dir: universal7885_treeui_kernel
          kernel-branch: 4.14_jackpotlte
          config: exynos7885-jackpotlte_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          ksu: true
          ksu-version: v0.9.4
#          nethunter: true
#          nethunter-patch: true
          android-version: 11
          aosp-clang-version: r383902
          disable-lto: true
          anykernel3: true
